<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS in JavaScript</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <div class="box red">Red Box</div>
        <div class="box green">Green Box</div>
        <div class=" box blue">Blue Box</div>
    </div>

    <div class="controls">
        <div class="btn" onclick="makeBlack()">1. Change to Black</div>
        <div class="btn" onclick="restoreColors()">2. Restore Colors</div>
        <div class="btn" onclick="hideBoxes()">3. Hide Boxes</div>
        <div class="btn" onclick="showBoxes()">4. Display Boxes</div>
    </div>
    




    <script src="main.js"></script>
</body>
</html>
