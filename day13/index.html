<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App | Day 13</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <!--HEADER-->
        <header class="header">
            <div>
                <h1>JENGA<span>NOTES</span></h1>
                <p>Capture ideas. Stay organized.</p>
            </div>

            <span class="badge">Day 13</span>
        </header>

        <!-- DASHBOARD -->
         <section class="dashboard">
            <div class="stat-card">
                <p>Total Notes</p>
                <h2 id="totalNotes">0</h2>
            </div>

            <div class="stat-card">
                <p>Pinned Notes</p>
                <h2 id="pinnedNotes">0</h2>
            </div>

         </section>
         <!-- NOTE FORM -->
          <section class="card">
            <h2 id="formHeading">Create New Note</h2>

            <form id="noteForm">
                <div class="form-group">
                    <label for="noteTitle">Note Title</label>
                    <input type="text" id="noteTitle" placeholder="Enter Note Title"
                    maxlength="100" required>
                </div>
                <div class="form-group">
                    <label for="noteContent"> Note Content</label>
                    <textarea 
                     id="noteContent"
                     placeholder="Write your note here..."
                     rows="5"
                     required
                     ></textarea>
                </div>
            </form>

        
          </section>
    </main>
</body>
</html>
