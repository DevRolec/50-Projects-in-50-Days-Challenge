<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms and Validations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        <!-- Form Elements.-->
         <label for="fullName">Full Name: </label>
         <input type="text" id="fullName" name="fullname"> <br>
         <button type="submit" id="submit">Submit</button>
    </form>
    <form>
        <input type="text"
        id="fullname"
        value="Roland">

    </form> <br>
    <form>
        <input type="text" name="name">  <br>

        <button type="submit">Submit</button><br>

        <button type="reset">Reset</button><br>

        <button type="button">Custom Action</button> <br>
        
    </form> <br>

    <!--Building Different Types of Form Inputs.-->
    <form action="#">
        <label for="names">Full Name:</label>
        <input type="text"
        id="names"
        name="names"
        required
        minlength="3"
        maxlength="50"
        autocomplete="name"
        placeholder="Enter your full name">
        
    </form> <br>
    <!--Email Inputs-->
    <form action="#">
        <label for="email">Email:</label>
        <input type="email"
        id="email"
        name="email"
        placeholder="Enter your E-mail."
        required>
        <button type="submit">Submit Email</button>
    </form> <br>

    <form action="#">
        <input type="password"
        id="password"
        name="password"
        minlength="8"
        maxlength="64"
        required>
        <button>Submit</button>
    </form><br><br>

    <form action="#">
        <input type="password"
        id="passworded"
        placeholder="Enter Your Password"
        >
        <button type="button" id="togglePassword">Show Password</button>
    </form> <br>

    <input type="number"
    id="age"
    name="age"
    min="1"
    max="100"
    required
    > 

<input type="tel" name="phone" id="tel">

<br><br>
<p>Select your Study Mode.</p>
<label for="#">
    <input type="radio"
    name="studyMode"
    value="Physical"
    > Physical
</label>
<label for="#">
    <input type="radio"
    name="studyMode"
    value="Online"
    > Online
</label>
<label for="#">
    <input type="radio"
    name="studyMode"
    value="Hybrid"
    > Hybrid
</label> <br><br>

<p>Select your Interest</p>


<label for="#">
    <input type="checkbox"
    name="interest"
    value="Coding"
    > Coding
</label> 
<label for="#">
    <input type="checkbox"
    name="interest"
    value="Robotics"
    > Robotics
</label>
<label for="#">
    <input type="checkbox"
    name="interest"
    value="AI"
    > Artificial Inteligence
</label> <br><br>

<!--TEXT AREA... This allows Users to  enter Longer texts-->
<label for="message"> Why do you want to join?</label>
<textarea name="message" id="message"
rows="5" maxlength="500" placeholder="Tell us about yourself"></textarea>

<br> <br> <br>
<input type="file"
id="passport"
name="passport"
accept="image/jpg, image/png, image/jpeg"
>































    <script src="script.js"></script>
</body>
</html>
